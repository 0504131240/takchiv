<script type="module">
// Firebase loaded asynchronously so app always renders even if Firebase fails
const FB_CFG={apiKey:"AIzaSyDU4O_IGPDLc7VkHR5ZvRbLzU6HKSa1C_E",authDomain:"moti1-848e7.firebaseapp.com",projectId:"moti1-848e7",storageBucket:"moti1-848e7.firebasestorage.app",messagingSenderId:"177637818983",appId:"1:177637818983:web:4830fff93f2dfa6746cac2"};
// db is set only once a Google account is signed in and its profiles are loaded;
// fdb is the Firestore handle itself. Every profile's data lives under
// profiles/{id}/data/*, readable only by the emails listed on the profile.
let db=null,fdb=null,auth=null,AUTH_USER=null,unsubFire=null,_doc=null,_setDoc=null,_onSnapshot=null,_getDoc=null,_F=null,_A=null;
function pDoc(name,pid){return _doc(fdb,'profiles',pid||CUR_UID,'data',name);}
function myEmail(){return(AUTH_USER?.email||'').toLowerCase();}
let USERS=[],CUR_UID='u1';
let EVENTS=[];
let INBOX=[],unsubInbox=null; // charges sent from the phone, waiting for approval
function loadEvents(){try{EVENTS=JSON.parse(localStorage.getItem('bdg_evt_'+CUR_UID)||'[]');}catch{EVENTS=[];}}
function saveEvents(){
  try{localStorage.setItem('bdg_evt_'+CUR_UID,JSON.stringify(EVENTS));}catch{}
  fbSaveEvents();
}
function fbSaveEvents(){
  if(!db||!_setDoc||!_doc)return;
  _setDoc(pDoc('evt'),{events:EVENTS}).catch(e=>console.warn('FB evt save:',e));
}
function fbLoadEvents(){
  if(!db||!_getDoc||!_doc)return;
  _getDoc(pDoc('evt')).then(snap=>{
    const fbEvts=snap.exists()?(snap.data().events||[]):[];
    // Events kept only on this device (e.g. never synced) are uploaded so other devices see them
    const localOnly=EVENTS.some(e=>!fbEvts.find(fe=>fe.id===e.id));
    // Merge: add any event from Firebase that isn't in local storage
    let changed=false;
    fbEvts.forEach(fe=>{
      if(!EVENTS.find(e=>e.id===fe.id)){EVENTS.push(fe);changed=true;}
    });
    if(localOnly)fbSaveEvents();
    if(changed){
      try{localStorage.setItem('bdg_evt_'+CUR_UID,JSON.stringify(EVENTS));}catch{}
      if(g('evO')||g('evdO'))rEvents();
    }
  }).catch(e=>console.warn('FB evt load:',e));
}
// USERS = the profiles the signed-in Google account may access (cached for offline start)
function loadUsers(){
  try{USERS=JSON.parse(localStorage.getItem('bdg_profiles')||'[]');}catch{USERS=[];}
  try{CUR_UID=localStorage.getItem('bdg_cur_user')||'';}catch{CUR_UID='';}
  if(!USERS.find(u=>u.id===CUR_UID))CUR_UID=USERS[0]?.id||'u1';
}
function saveUsers(){
  try{localStorage.setItem('bdg_profiles',JSON.stringify(USERS));}catch{}
  try{localStorage.setItem('bdg_cur_user',CUR_UID);}catch{}
  fbSaveUsers();
}
// Fields the app owns on a profile doc; merged so server-side fields (lastMailDay) are kept
const escH=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The signed-in person's name on a profile: set in sharing, else the first name of their Google account
function myName(u){
  const n=u?.members?.[myEmail()];
  return (n||(AUTH_USER?.displayName||'').trim().split(/\s+/)[0]||'').trim();
}
function profData(u){
  const d={name:u.name,emails:u.emails||[myEmail()],reminders:u.reminders||[],mailSummary:!!u.mailSummary,pin:u.pin||_F.deleteField()};
  if(u.monthStart)d.monthStart=u.monthStart;
  if(u.members)d.members=u.members; // display names of the people sharing the profile: {email: name}
  return d;
}
function fbSaveUsers(){
  if(!db)return;
  USERS.forEach(u=>_setDoc(_doc(fdb,'profiles',u.id),profData(u),{merge:true}).catch(e=>console.warn('FB profile save:',e)));
}
async function fbLoadProfiles(){
  const email=myEmail();
  let qs;
  try{qs=await _F.getDocs(_F.query(_F.collection(fdb,'profiles'),_F.where('emails','array-contains',email)));}
  catch(e){
    console.warn('FB profiles load:',e);
    // Offline: keep working from this account's cached profiles
    if(USERS.length&&localStorage.getItem('bdg_auth')===email){db=fdb;reloadCurUser();rLockScreen();}
    else rLogin('אין חיבור לשרת. נסה שוב מאוחר יותר.');
    return;
  }
  const hadCur=!!USERS.find(u=>u.id===CUR_UID)&&localStorage.getItem('bdg_auth')===email;
  USERS=qs.docs.map(d=>({id:d.id,...d.data()}));
  try{localStorage.setItem('bdg_auth',email);localStorage.setItem('bdg_profiles',JSON.stringify(USERS));}catch{}
  if(!USERS.length){db=null;rWelcome();return;}
  if(!USERS.find(u=>u.id===CUR_UID))CUR_UID=USERS[0].id;
  try{localStorage.setItem('bdg_cur_user',CUR_UID);}catch{}
  db=fdb;reloadCurUser();
  // The mail job reads the cycle start day from the profile; copy this device's setting there
  {const cu=USERS.find(u=>u.id===CUR_UID),ms=parseInt(getCfg().monthStart)||0;if(cu&&ms>1&&cu.monthStart!==ms){cu.monthStart=ms;saveUsers();}}
  if(!hadCur&&USERS.length>1)rPickUser();else rLockScreen();
}
function reloadCurUser(){
  ld();loadEvents();
  if(db){fbListen(S.year);fbLoadBudgets();fbLoadEvents();fbListenInbox();}
}
function fbListenInbox(){
  if(unsubInbox){unsubInbox();unsubInbox=null;}
  INBOX=[];
  if(!db||!_onSnapshot)return;
  unsubInbox=_onSnapshot(pDoc('inbox'),snap=>{
    INBOX=snap.exists()?(snap.data().items||[]):[];
    if(g('inbO'))rInbox();
    else if(!GATE&&!['m1','m2','m3'].some(id=>g(id)?.innerHTML.trim()))rAll();
  },e=>console.warn('FB inbox:',e));
}
function fbSave(){
  if(!db||!_setDoc||!_doc)return;
  _setDoc(pDoc('y'+S.year),{cats:S.cats,mData:S.mData}).catch(e=>console.warn('FB save:',e));
}
function saveBudgets(){
  const bdata=S.cats.map(c=>({id:c.id,budget:c.budget||0,budgetRec:c.budgetRec||0,subs:(c.subs||[]).map(s=>({id:s.id,budget:s.budget||0}))}));
  try{localStorage.setItem('bdg_bud_'+CUR_UID,JSON.stringify(bdata));}catch{}
  if(!db)setPend('bud',true);
  if(db&&_setDoc&&_doc)_setDoc(pDoc('bud'),{b:bdata}).catch(e=>console.warn('FB bud save:',e));
}
function applyBudgets(cats){
  try{
    const r=localStorage.getItem('bdg_bud_'+CUR_UID);if(!r)return;
    JSON.parse(r).forEach(b=>{
      const c=cats.find(c=>c.id===b.id);if(!c)return;
      if(b.budget>0)c.budget=b.budget;else delete c.budget;
      if(b.budgetRec>0)c.budgetRec=b.budgetRec;else delete c.budgetRec;
      if(b.subs&&c.subs)b.subs.forEach(sb=>{const s=c.subs.find(s=>s.id===sb.id);if(s){if(sb.budget>0)s.budget=sb.budget;else delete s.budget;}});
    });
  }catch{}
}
function fbLoadBudgets(){
  if(!db||!_getDoc||!_doc)return;
  if(getPend().bud){saveBudgets();setPend('bud',false);return;}
  _getDoc(pDoc('bud')).then(snap=>{
    if(!snap.exists())return;
    const bdata=snap.data().b||[];
    try{localStorage.setItem('bdg_bud_'+CUR_UID,JSON.stringify(bdata));}catch{}
    applyBudgets(S.cats);rAll();
  }).catch(e=>console.warn('FB bud load:',e));
}
function fbListen(year){
  if(!db||!_onSnapshot||!_doc){return;}
  if(unsubFire)unsubFire();
  unsubFire=_onSnapshot(pDoc('y'+year),snap=>{
    const pend=getPend()['y'+year];
    let local=null;
    if(pend){try{local=JSON.parse(localStorage.getItem(sk(year))||'null');}catch{}}
    if(!snap.exists()){
      // Nothing in the cloud yet: upload what this device saved offline
      if(local?.mData&&year===S.year){fbSave();setPend('y'+year,false);}
      return;
    }
    const d=snap.data();
    // Keep what was added on this device while offline instead of overwriting it with the cloud copy
    if(local?.mData){
      d.cats=d.cats||[];d.mData=d.mData||{};
      const n=mergeLocalYear(d,local);
      setPend('y'+year,false);
      if(n)_setDoc(pDoc('y'+year),{cats:d.cats,mData:d.mData}).catch(e=>console.warn('FB merge save:',e));
    }
    S.cats=d.cats||DF.map(c=>({...c}));
    S.mData=d.mData||iMD(S.cats);
    eC(S.cats,S.mData);ensureCharity();
    const _start=parseInt(getCfg().monthStart)||1;
    if(_start>1){const _nd=migrateToStartDay(S.mData,S.cats,_start);if(JSON.stringify(_nd)!==JSON.stringify(S.mData)){S.mData=_nd;fbSave();}}
    applyBudgets(S.cats);
    try{localStorage.setItem(sk(year),JSON.stringify({cats:S.cats,mData:S.mData}));}catch{}
    const open=['m1','m2','m3'].some(id=>{const el=g(id);return el&&el.innerHTML.trim();});
    if(!open)rAll();
    setSyncDot(true);
  },e=>{console.warn('FB listen:',e);setSyncDot(false);});
}
let SYNC_OK=null; // last known cloud connection state, shown in settings → סנכרון
function setSyncDot(ok){SYNC_OK=ok;const el=g('syncDot');if(el)el.style.background=ok?'#3d7556':'#b0472e';}

function getCfg(){try{return JSON.parse(localStorage.getItem('bdg_cfg_'+CUR_UID)||'{}');}catch{return{};}}
function saveCfg(c){try{localStorage.setItem('bdg_cfg_'+CUR_UID,JSON.stringify({...getCfg(),...c}));}catch{}}
function cycleMonthForDate(dateStr,start){
  if(!dateStr||start<=1)return null;
  try{const p=dateStr.split('-'),day=parseInt(p[2]),month=parseInt(p[1])-1;
  if(day>=start)return month;
  if(month===0)return null;// Jan→Dec crosses year, keep in place
  return month-1;}catch{return null;}
}
function migrateToStartDay(mData,cats,start){
  if(start<=1)return mData;
  const nd={};
  for(let m=0;m<12;m++){nd[m]={income:[]};cats.forEach(c=>{nd[m][c.id]={entries:[]};});}
  for(let m=0;m<12;m++){
    if(!mData[m])continue;
    (mData[m].income||[]).forEach(e=>{const t=cycleMonthForDate(e.date,start);(t!==null?nd[t]:nd[m]).income.push(e);});
    cats.forEach(c=>{(mData[m]?.[c.id]?.entries||[]).forEach(e=>{
      const t=e.recurring?null:cycleMonthForDate(e.date,start);
      nd[t!==null?t:m][c.id].entries.push(e);
    });});
  }
  return nd;
}
function todayPeriod(){
  const d=new Date(),day=d.getDate(),start=parseInt(getCfg().monthStart)||1;
  if(start<=1)return{month:d.getMonth(),year:d.getFullYear()};
  if(day>=start)return{month:d.getMonth(),year:d.getFullYear()};
  const m=d.getMonth()-1;
  return m<0?{month:11,year:d.getFullYear()-1}:{month:m,year:d.getFullYear()};
}
const MO=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function moLabel(m){
  const start=parseInt(getCfg().monthStart)||1;
  if(start>=15)return MO[(m+1)%12];
  return MO[m];
}
function cycleRangeLabel(m){
  const start=parseInt(getCfg().monthStart)||1;
  if(start<=1)return '';
  return `${start} ${MO[m]} – ${start-1} ${MO[(m+1)%12]}`;
}
const CL=["#4f46e5","#0ea5e9","#f59e0b","#10b981","#8b5cf6","#ef4444","#f97316","#14b8a6","#ec4899","#84cc16"];
const DF=[
  {id:1,name:"מזון וקניות",budget:3000,color:"#527461"},
  {id:2,name:"חשבונות ותשלומים",budget:2000,color:"#0ea5e9"},
  {id:3,name:"תחבורה",budget:1000,color:"#f59e0b"},
  {id:4,name:"בריאות",budget:800,color:"#3d7556"},
  {id:5,name:"חינוך",budget:1500,color:"#4f735f"},
];

let S={year:new Date().getFullYear(),month:new Date().getMonth(),view:"monthly",cats:[],mData:{},aCat:null,eCat:null,nc:{name:"",budget:"",budgetRec:"",color:"#527461",isRec:false},sortEnt:"date",editEntId:null,expFilter:"variable",chartIdx:0};
let deferredPrompt=null,touchStartX=0,touchStartY=0,touchStartTarget=null;

// "צדקה" is a built-in category: always present (found by flag or name), used for maaser
function charityCat(){return S.cats.find(c=>c.builtin==='charity')||S.cats.find(c=>(c.name||'').trim()==='צדקה');}
function ensureCharity(){
  let c=charityCat();
  if(!c){c={id:Math.max(0,...S.cats.map(x=>x.id))+1,name:'צדקה',color:'#a85a6b'};S.cats.push(c);}
  c.builtin='charity';
  eC(S.cats,S.mData);
}
function sk(y){return"bdg_v4_"+CUR_UID+"_"+y;}
// Changes saved on this device while the cloud wasn't reachable ({y2026:1, bud:1}); merged up on the next connection
function getPend(){try{return JSON.parse(localStorage.getItem('bdg_pend_'+CUR_UID)||'{}');}catch{return{};}}
function setPend(k,on){const p=getPend();if(on)p[k]=1;else delete p[k];try{localStorage.setItem('bdg_pend_'+CUR_UID,JSON.stringify(p));}catch{}}
// Add to the cloud year doc every category, entry and income line that exists only in the local copy
function mergeLocalYear(cloud,local){
  let added=0;
  const key=e=>e&&e.id!=null?'i'+e.id:JSON.stringify(e);
  (local.cats||[]).forEach(lc=>{if(!cloud.cats.find(c=>c.id===lc.id)){cloud.cats.push({...lc});added++;}});
  for(let m=0;m<12;m++){
    const lm=local.mData?.[m];if(!lm)continue;
    const cm=cloud.mData[m]||(cloud.mData[m]={income:[]});
    const addAll=(from,to)=>{const have=new Set(to.map(key));from.forEach(e=>{if(!have.has(key(e))){to.push(e);added++;}});};
    addAll(lm.income||[],cm.income||(cm.income=[]));
    Object.keys(lm).forEach(k=>{if(k==='income'||!lm[k]?.entries)return;const cc=cm[k]||(cm[k]={entries:[]});addAll(lm[k].entries,cc.entries||(cc.entries=[]));});
  }
  return added;
}

// ---------- Accessibility (Israeli standard IS 5568 / WCAG 2.0 AA) ----------
// Screens are built as HTML strings with click handlers attached afterwards, so one pass after each
// render gives every control a keyboard role and an accessible name, and every window dialog semantics.
const ICON_NAMES={'×':'סגור','✕':'סגור','✎':'עריכה','🗑':'מחיקה','+':'הוספה','←':'חזרה','→':'חזרה','‹':'הקודם','›':'הבא'};
const ID_NAMES={prevMon:'החודש הקודם',nextMon:'החודש הבא',dC:'מחיקת קטגוריה',eC:'עריכת קטגוריה',editEnt:'עריכת הוצאה',dEn:'מחיקת הוצאה',addRem:'הוספת תזכורת',backToProfile:'חזרה'};
let _a11yT=0,_dlgStack=[];
function a11ySoon(){clearTimeout(_a11yT);_a11yT=setTimeout(a11yPass,0);}
function a11yPass(){
  const roots=['hdr','tlb','cnt','m1','m2','m3'].map(g).filter(Boolean);
  roots.forEach(r=>r.querySelectorAll('*').forEach(el=>{
    const tag=el.tagName;
    // Clickable non-button elements: reachable and operable from the keyboard
    if(el.onclick&&!/^(BUTTON|A|INPUT|SELECT|TEXTAREA|LABEL|SUMMARY|OPTION)$/.test(tag)&&!el.hasAttribute('role')&&!el.classList.contains('overlay')){el.setAttribute('role','button');el.tabIndex=0;}
    if(tag==='BUTTON'&&!el.getAttribute('aria-label')){
      const t=el.textContent.trim();
      if(!/[א-תA-Za-z0-9]/.test(t)){const n=ID_NAMES[el.id]||ID_NAMES[el.className]||ICON_NAMES[t]||(/X$/.test(el.id)?'סגור':'');if(n)el.setAttribute('aria-label',n);}
    }
    // Form fields named by their placeholder, or by the short text just before them
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)&&el.type!=='hidden'&&!el.getAttribute('aria-label')&&!el.closest('label')&&!(el.id&&document.querySelector('label[for="'+el.id+'"]'))){
      const prev=el.previousElementSibling;
      const n=el.placeholder||el.title||(prev&&prev.textContent.trim().length<40?prev.textContent.trim():'')||(tag==='SELECT'?'בחירה':'');
      if(n)el.setAttribute('aria-label',n.replace(/[:…]+$/,''));
    }
    // Color swatches: named and marked when chosen
    if(el.classList.contains('csw')){el.setAttribute('aria-label','צבע '+([...el.parentElement.querySelectorAll('.csw')].indexOf(el)+1));el.setAttribute('aria-pressed',el.classList.contains('on')?'true':'false');}
    if(tag==='svg'&&!el.hasAttribute('role')){el.setAttribute('role','img');el.setAttribute('aria-label','תרשים');}
  }));
  // Windows: dialog semantics; focus moves in, and back out when they close
  // Closed windows give focus back; a window redrawn in place (same id) keeps where focus returns to
  const gone=_dlgStack.filter(d=>!d.o.isConnected);
  _dlgStack=_dlgStack.filter(d=>d.o.isConnected);
  const redrawn=new Set();
  document.querySelectorAll('.overlay').forEach(o=>{
    const m=o.querySelector('.modal')||o.firstElementChild;if(!m||m.getAttribute('role')==='dialog')return;
    const prev=o.id&&gone.find(d=>d.o.id===o.id);if(prev)redrawn.add(prev);
    m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.tabIndex=-1;
    const ttl=[...m.querySelectorAll('span,div,h1,h2,h3')].find(e=>parseFloat(getComputedStyle(e).fontSize)>=16&&e.textContent.trim()&&e.children.length<=1);
    if(ttl){ttl.id=ttl.id||'dlgT'+Math.random().toString(36).slice(2,8);m.setAttribute('aria-labelledby',ttl.id);}
    const back=prev?prev.back:document.activeElement;
    _dlgStack.push({o,back,backId:prev?prev.backId:back&&back.id});
    // Focus the window itself (not a field, so phones don't pop up the keyboard), unless the screen already focused something inside
    if(!m.contains(document.activeElement))m.focus({preventScroll:true});
  });
  // The element focus returns to may have been redrawn meanwhile: find it again by id
  gone.forEach(d=>{if(redrawn.has(d))return;const el=d.back&&d.back.isConnected?d.back:d.backId&&document.getElementById(d.backId);if(el)el.focus({preventScroll:true});});

}
document.addEventListener('keydown',e=>{
  const t=e.target;
  // Enter / Space activate role=button elements like real buttons
  if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'){e.preventDefault();t.click();return;}
  const top=_dlgStack[_dlgStack.length-1];if(!top||!top.o.isConnected)return;
  if(e.key==='Escape'){
    const x=top.o.querySelector('[data-esc]')||[...top.o.querySelectorAll('button')].find(b=>b.getAttribute('aria-label')==='סגור'||/X$/.test(b.id));
    if(x){e.preventDefault();x.click();}
  }else if(e.key==='Tab'){
    // Keep keyboard focus inside the open window
    const f=[...top.o.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
  }
});

function applyA11y(){
  const p=a11yPrefs(),h=document.documentElement;
  h.style.zoom=p.size&&p.size!==1?String(p.size):'';

function adjDate(dateStr,month,year){
  if(!dateStr)return today();
  const p=dateStr.split('-');
  const y=year||parseInt(p[0]);
  const day=parseInt(p[2]);
  const lastDay=new Date(y,month+1,0).getDate();
  return String(y)+'-'+String(month+1).padStart(2,'0')+'-'+String(Math.min(day,lastDay)).padStart(2,'0');
}

// Budget month a date belongs to, honoring "month starts on day N": {y, m}
function dateBucket(ds){
  const [y,mo,d]=ds.split('-').map(Number),st=parseInt(getCfg().monthStart)||1;
  let m=mo-1,yy=y;if(st>1&&d<st){m--;if(m<0){m=11;yy--;}}
  return{y:yy,m};
}
// The date with ds's day of month that falls in budget month (by, bm)
function bucketDate(ds,by,bm){
  const d=parseInt(ds.split('-')[2]),st=parseInt(getCfg().monthStart)||1;
  const abs=by*12+bm+((st>1&&d<st)?1:0);
  return adjDate(ds,abs%12,Math.floor(abs/12));
}

// Installment series: payments "desc (k/N)" with ids base+(k-1)*1000 in consecutive months
function instInfo(e){
  if(!e||e.recurring)return null;
  if(e.inst)return e.inst;
  const m=/\((\d+)\/(\d+)\)\s*$/.exec(e.desc||'');if(!m)return null;
  const k=+m[1],n=+m[2];if(n<2||k<1||k>n)return null;
  return{base:e.id-(k-1)*1000,n,i:k-1};
}
const instBase=d=>(d||'').replace(/\s*\(\d+\/\d+\)\s*$/,'');
const instDesc=(b,k,n)=>b?(b+' ('+k+'/'+n+')'):(k+'/'+n);
// Run fn(entry,k,year,month) on every payment of the series of `e` (an entry of S.month);
// fn returns the new entry, or null to delete it
function forInstSeries(e,catId,fn){
  const info=instInfo(e),start=S.year*12+S.month-info.i,byYear={};
  for(let k=0;k<info.n;k++){const abs=start+k;(byYear[Math.floor(abs/12)]=byYear[Math.floor(abs/12)]||[]).push({k,m:abs%12});}
  const apply=(mData,list,y)=>{
    let chg=false;
    list.forEach(({k,m})=>{
      const c=mData?.[m]?.[catId];if(!c)return;
      const id=info.base+k*1000,out=[];
      (c.entries||[]).forEach(x=>{if(x.id===id){chg=true;const r=fn(x,k,y,m);if(r)out.push(r);}else out.push(x);});
      c.entries=out;
    });
    return chg;
  };
  Object.keys(byYear).forEach(ys=>{const y=+ys;if(y===S.year)apply(S.mData,byYear[y],y);else editYear(y,d=>apply(d.mData,byYear[y],y),true);});
  sv();
}

function trendHTML(catId){
  const curr=ct(S.month,catId),prev=ct((S.month-1+12)%12,catId);
  if(!prev||!curr)return"";
  const pct=Math.round(((curr-prev)/prev)*100);
  if(pct>5)return`<span style="font-size:10px;color:#b0472e">&#9650;${pct}%</span>`;
  if(pct<-5)return`<span style="font-size:10px;color:#3d7556">&#9660;${Math.abs(pct)}%</span>`;
  return`<span style="font-size:10px;color:#756a5c">&rarr;</span>`;
}

function rPie(){
  const total=mt(S.month);
  if(!total)return"";
  const slices=S.cats.map(cat=>({cat,val:ct(S.month,cat.id)})).filter(s=>s.val>0);
  if(!slices.length)return"";
  let angle=-Math.PI/2,paths="",legend="";
  const r=52,cx=62,cy=62;
  slices.forEach(s=>{
    const pct=s.val/total,sa=angle;
    angle+=pct*2*Math.PI;
    if(pct>0.999){paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.cat.color}"/>`;}
    else{const x1=(cx+r*Math.cos(sa)).toFixed(1),y1=(cy+r*Math.sin(sa)).toFixed(1),x2=(cx+r*Math.cos(angle)).toFixed(1),y2=(cy+r*Math.sin(angle)).toFixed(1);paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${pct>0.5?1:0},1 ${x2},${y2} Z" fill="${s.cat.color}"/>`;}
    legend+=`<div style="display:flex;align-items:center;gap:4px"><div style="width:7px;height:7px;border-radius:50%;background:${s.cat.color};flex-shrink:0"></div><span style="font-size:10px;color:#6f6457">${s.cat.name}</span><span style="font-size:10px;font-weight:700;color:#2f2a24">${Math.round(pct*100)}%</span></div>`;
  });

}

const normD=t=>String(t||'').toLowerCase().replace(/["'״׳`]/g,'').replace(/\s+/g,' ').trim();
// Category and description for a business name, from the expenses already recorded
function guessCharge(merchant){
  const m=normD(merchant),base=normD(String(merchant||'').split(/\s+-\s+/)[0]);
  const tally={};
  const look=mData=>{for(let mo=0;mo<12;mo++){const md=mData?.[mo];if(!md)continue;
    S.cats.forEach(c=>(md[c.id]?.entries||[]).forEach(e=>{const d=normD(e.desc);if(d.length<3)return;
      const score=d===m?3:d===base?2:(m.includes(d)||d.includes(base)&&base.length>=3)?1:0;
      if(!score)return;const k=c.id+'|'+e.desc;tally[k]=(tally[k]||0)+score;}));}};
  look(S.mData);
  try{look(JSON.parse(localStorage.getItem(sk(S.year-1))||'{}').mData);}catch{}
  const best=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  if(!best)return{cat:null,desc:String(merchant||'').split(/\s+-\s+/)[0]};
  const i=best[0].indexOf('|');
  return{cat:parseInt(best[0].slice(0,i)),desc:best[0].slice(i+1)};
}

      <div style="display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;border:1px dashed #d6ccbe;margin-bottom:6px">

          <select class="inp" id="remType" aria-label="מתי" style="padding:8px;flex:1"><option value="monthly">כל חודש ביום</option><option value="once">בתאריך</option></select>
          <input class="inp" id="remDay" type="number" min="1" max="31" placeholder="יום" style="width:70px;padding:8px;text-align:center"/>
          <input class="inp" id="remDate" type="date" aria-label="תאריך" style="flex:1;padding:8px;display:none"/>
          <button id="addRem" aria-label="הוספת תזכורת" style="padding:8px 12px;border-radius:10px;border:none;background:#a14b06;color:#fff;font-size:13px;font-weight:700;cursor:pointer">+</button>
        </div>
      </div>
      <div style="font-size:12px;color:#6f6457">נשלח בבוקר לכל המיילים שברשימת השיתוף של הפרופיל.</div>`;
  }else if(key==='account'){
    body=`${H('מחובר/ת עם Google')}

        <button id="signOut" style="padding:7px 14px;border-radius:8px;border:1px solid #f0cfc2;background:#fbefe9;color:#b0472e;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">התנתק</button>

      </div>
      <button id="delAcc" style="width:100%;padding:11px;border-radius:10px;border:1px solid #f0cfc2;background:#fff;color:#b0472e;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">מחיקת החשבון והנתונים</button>`;

    close();
    const u=USERS.find(u=>u.id===b.dataset.uid);
    if(u?.pin){rUserMod(null,null,b.dataset.uid);}
    else{CUR_UID=b.dataset.uid;saveUsers();ld();loadEvents();ih("m2","");if(db){fbListen(S.year);fbLoadEvents();fbListenInbox();}setUnlocked(CUR_UID);rAll();}
  });
  // security
  if(g("savePin"))g("savePin").onclick=()=>{const pin=(g("pinInput").value||"").trim();if(pin)cu.pin=pin;else delete cu.pin;saveUsers();refresh('savePin');};

    if(hasBiometric(CUR_UID)){localStorage.removeItem('bdg_cred_'+CUR_UID);refresh();}

  };

  if(g("darkTgl"))g("darkTgl").onchange=()=>{DARK=g("darkTgl").checked;try{localStorage.setItem('bdg_dark',DARK?'1':'0');}catch{}applyDark();rAll();refresh();};

    const d=Math.max(1,Math.min(28,parseInt(g("monthStartInp").value)||1));
    saveCfg({monthStart:d});cu.monthStart=d;saveUsers();
    S.mData=migrateToStartDay(S.mData,S.cats,d);
    sv();const p=todayPeriod();S.month=p.month;S.year=p.year;
    ld();fbListen(S.year);rAll();refresh('saveMonthStart');
  };
  // share
  if(g("addEm"))g("addEm").onclick=()=>{
    const em=(g("shareEm").value||"").trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){g("shareEm").focus();return;}
    cu.emails=[...new Set([...(cu.emails||[myEmail()]),em])];
    const nm=(g("shareName").value||"").trim().slice(0,30);if(nm)cu.members={...(cu.members||{}),[em]:nm};
    saveUsers();rHdr();refresh('addEm');
  };
  document.querySelectorAll(".rmEm").forEach(b=>b.onclick=()=>{
    if(!confirm('להסיר את '+b.dataset.em+' מהפרופיל?'))return;
    cu.emails=(cu.emails||[]).filter(e=>e!==b.dataset.em);
    if(cu.members){const m={...cu.members};delete m[b.dataset.em];cu.members=m;}
    saveUsers();
    if(b.dataset.em===myEmail())location.reload();else refresh();
  });
  if(g("saveNames"))g("saveNames").onclick=()=>{
    const m={...(cu.members||{})};
    document.querySelectorAll(".memName").forEach(i=>{const v=i.value.trim().slice(0,30);if(v)m[i.dataset.em]=v;else delete m[i.dataset.em];});
    cu.members=m;saveUsers();rHdr();refresh('saveNames');
  };
  // sync: personal key for /api/ingest and /api/income, kept on the profile (only its members can read it)
  const setIngest=async k=>{
    if(!db){alert('צריך חיבור לאינטרנט');return;}
    try{await _setDoc(_doc(fdb,'profiles',cu.id),{ingestKey:k||_F.deleteField()},{merge:true});}catch(e){alert('השמירה נכשלה');return;}
    if(k)cu.ingestKey=k;else delete cu.ingestKey;saveUsers();refresh();
  };
  if(g("ingOn"))g("ingOn").onclick=()=>{const b=crypto.getRandomValues(new Uint8Array(24));setIngest([...b].map(x=>x.toString(16).padStart(2,'0')).join(''));};
  if(g("ingOff"))g("ingOff").onclick=()=>{if(confirm('לבטל את הכתובת? הטלפון ואפליקציית העסק יפסיקו לשלוח עד שתגדיר כתובת חדשה.'))setIngest(null);};

  if(g("mailSum"))g("mailSum").onchange=()=>{cu.mailSummary=g("mailSum").checked;saveUsers();rUserMod('edit');};

    const text=(g("remText").value||"").trim();if(!text){g("remText").focus();return;}
    const type=g("remType").value,r={id:Date.now(),text,type};
    if(type==='once'){r.date=g("remDate").value;if(!r.date){g("remDate").focus();return;}}
    else{r.day=Math.max(1,Math.min(31,parseInt(g("remDay").value)||0));if(!parseInt(g("remDay").value)){g("remDay").focus();return;}}
    cu.reminders=[...(cu.reminders||[]),r];saveUsers();refresh('addRem');
  };
  document.querySelectorAll(".rmRem").forEach(b=>b.onclick=()=>{cu.reminders=(cu.reminders||[]).filter(r=>String(r.id)!==b.dataset.id);saveUsers();refresh();});
  // account
  if(g("signOut"))g("signOut").onclick=fbSignOut;
  if(g("delAcc"))g("delAcc").onclick=deleteAccount;
}

// Accessibility window (opened from settings): display preferences for this device + the statement

  ih("m3",`<div class="overlay" id="a11yO"><div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:17px;font-weight:800;color:#2f2a24">&#9855; נגישות</span>
      <button id="a11yX" style="background:#f3ece2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:#6f6457">&times;</button>
    </div>
    <div style="font-size:12px;color:#6f6457;margin-bottom:14px">ההגדרות נשמרות במכשיר הזה.</div>

    <div role="group" aria-labelledby="a11ySzL" style="display:flex;gap:6px;margin-bottom:16px">${sizeBtn(1,'רגיל',13)}${sizeBtn(1.15,'גדול',15)}${sizeBtn(1.3,'גדול מאוד',17)}</div>
    ${opt('hc','ניגודיות גבוהה','צבעים חדים יותר להבדלה קלה בין טקסט לרקע')}
    ${opt('rm','עצירת אנימציות','ביטול תנועות ומעברים במסך')}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">

      <button id="a11yReset" style="padding:7px 12px;border-radius:9px;border:1px solid #ece4d8;background:#fff;color:#6f6457;font-size:12px;cursor:pointer;font-family:inherit">איפוס להגדרות רגילות</button>
    </div>

function rMaaser(){
  const r=maaserOf(S.month);
  let yDue=0,yGiven=0;for(let m=0;m<12;m++){const x=maaserOf(m);yDue+=x.due;yGiven+=x.given;}
  const yLeft=yDue-yGiven;
  const row=(l,v,c='#2f2a24',b=400)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f3ece2"><span style="color:#6f6457;font-size:14px">${l}</span><span style="font-weight:${b};color:${c};font-size:15px">&#8362;${fm(v)}</span></div>`;
  const verdict=(left)=>left>0?`<div style="font-size:13px;color:#9e5868">נשאר להשלים</div><div style="font-size:30px;font-weight:800;color:#9e5868">&#8362;${fm(left)}</div>`
    :`<div style="font-size:13px;color:#3f7356">${left<0?'נתת יותר מהמעשר ב-':'המעשר הושלם'}</div><div style="font-size:30px;font-weight:800;color:#3f7356">${left<0?'&#8362;'+fm(-left):'&#10004;'}</div>`;
  ih("m2",`<div class="overlay" id="maO"><div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:17px;font-weight:800;color:#2f2a24">&#129518; מעשר — ${moLabel(S.month)}</span>
      <button id="maX" style="background:#f3ece2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:#6f6457">&times;</button>
    </div>
    ${row('הכנסות החודש',r.inc)}
    ${row('מעשר (10%)',r.due,'#2f2a24',700)}
    ${row('ניתן לצדקה',r.given,'#a85a6b')}
    <div style="text-align:center;background:${r.left>0?'#f8eef0':'#eef5ef'};border-radius:14px;padding:14px;margin:14px 0">${verdict(r.left)}</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="inp" id="maAmt" type="number" inputmode="decimal" min="0" placeholder="סכום שנתתי" value="${r.left>0?r.left:''}" style="flex:1;padding:10px 12px;font-size:16px;text-align:center"/>
      <button id="maGive" style="padding:10px 16px;border-radius:10px;border:none;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(135deg,#a85a6b,#9e5868);cursor:pointer;white-space:nowrap">&#10004; נתתי</button>
    </div>
    <div style="font-size:12px;color:#756a5c;text-align:center">מתחילת ${S.year}: מעשר &#8362;${fm(yDue)} · ניתן &#8362;${fm(yGiven)} · ${yLeft>0?'להשלים &#8362;'+fm(yLeft):yLeft<0?'עודף &#8362;'+fm(-yLeft):'מאוזן'}</div>
  </div></div>`);
  g("maX").onclick=()=>ih("m2","");
  // Record a donation as an entry in this month's "צדקה" category
  g("maGive").onclick=()=>{
    const a=Math.round((parseFloat(g("maAmt").value)||0)*100)/100;if(a<=0){g("maAmt").focus();return;}
    const c=charityCat();if(!c)return;
    const p=todayPeriod(),date=(p.month===S.month&&p.year===S.year)?today():adjDate(today(),S.month,S.year);
    if(!S.mData[S.month][c.id])S.mData[S.month][c.id]={entries:[]};
    S.mData[S.month][c.id].entries.push({id:Date.now(),desc:'מעשר',amount:a,date,recurring:false,subCat:null});
    sv();rMon();rMaaser();
  };
  g("maAmt").onkeydown=e=>{if(e.key==="Enter")g("maGive").click();};
  g("maO").onclick=e=>{if(e.target.id==="maO")ih("m2","");};
}
// Progress bar color by how much of the budget is used: blue, orange from 80%, red from 100%

function rExpMod(){
  let selCat=S.cats[0]?.id||null;
  let selSub=null;
  let _desc='',_amt='',_date=today(),_rec=false,_inst=1;
  function build(){
    const catBtns=S.cats.map(cat=>{
      const sel=selCat===cat.id;
      return`<button class="expCat" data-c="${cat.id}" style="padding:9px 12px;border-radius:11px;border:2px solid ${sel?cat.color:'#ece4d8'};background:${sel?cat.color+'18':'#fff'};cursor:pointer;display:flex;align-items:center;gap:7px;flex:1 0 130px;min-width:0">
        <div style="width:9px;height:9px;border-radius:50%;background:${cat.color};flex-shrink:0"></div>
        <span style="font-size:12px;font-weight:${sel?700:400};color:${sel?cat.color:'#6f6457'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat.name}</span>
      </button>`;
    }).join("");
    const selCatObj=S.cats.find(c=>c.id===selCat);
    const subBtns=selCatObj?.subs?.length?`<div style="font-size:11px;font-weight:600;color:#756a5c;margin-bottom:7px;letter-spacing:.5px">תת-קטגוריה</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px">${selCatObj.subs.map(sub=>{const sel=selSub===sub.id;return`<button class="expSub" data-s="${sub.id}" style="padding:6px 12px;border-radius:9px;border:2px solid ${sel?selCatObj.color:'#ece4d8'};background:${sel?selCatObj.color+'18':'#fff'};cursor:pointer;font-size:12px;font-weight:${sel?700:400};color:${sel?selCatObj.color:'#6f6457'}">${sub.name}</button>`;}).join('')}</div>`:'';
    ih("m1",`<div class="overlay" id="expO"><div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div>
          <div style="font-size:17px;font-weight:800;color:#2f2a24">הוצאה חדשה</div>
          <div style="font-size:11px;color:#756a5c">${moLabel(S.month)} ${S.year}</div>
        </div>
        <button id="cExp" style="background:#f3ece2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:#6f6457">&times;</button>
      </div>
      <div style="font-size:11px;font-weight:600;color:#756a5c;margin-bottom:7px;letter-spacing:.5px">קטגוריה</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px">${catBtns}</div>
      ${subBtns}
      <div style="font-size:11px;font-weight:600;color:#756a5c;margin-bottom:5px;letter-spacing:.5px">תיאור</div>
      <input class="inp" id="expD" placeholder="למשל: סופר, תדלוק, קפה..." style="margin-bottom:14px" value="${_desc.replace(/"/g,'&quot;')}"/>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <div style="flex:1">
          <div style="font-size:11px;font-weight:600;color:#756a5c;margin-bottom:5px;letter-spacing:.5px">סכום &#8362;</div>
          <input class="inp" id="expA" type="number" placeholder="0" style="font-size:22px;font-weight:800;color:#527461;text-align:center" value="${_amt}"/>
        </div>
        <div style="flex:1">
          <div style="font-size:11px;font-weight:600;color:#756a5c;margin-bottom:5px;letter-spacing:.5px">תאריך</div>
          <input class="inp" id="expDt" type="date" value="${_date}"/>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px">
        <div style="flex:1">
          <div style="font-size:11px;font-weight:600;color:#756a5c;margin-bottom:5px;letter-spacing:.5px">תשלומים</div>
          <input class="inp" id="expInst" type="number" min="1" max="60" placeholder="1" style="text-align:center;font-size:18px;font-weight:700;color:#527461" value="${_inst}"/>
        </div>
        <div style="flex:2;padding-bottom:2px;font-size:11px;color:#756a5c;line-height:1.5">פיצול לחודשים עוקבים<br/>(1 = ללא פיצול)</div>
      </div>
      <label style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#faf6ef;border:1px solid #ece4d8;cursor:pointer;margin-bottom:16px">
        <input type="checkbox" id="expRec" style="width:18px;height:18px;accent-color:#527461;flex-shrink:0" ${_rec?'checked':''}/>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#2f2a24">הוצאה קבועה</div>
          <div style="font-size:11px;color:#756a5c">תתוסף אוטומטית לכל החודשים</div>
        </div>
        <span style="font-size:22px">&#128260;</span>
      </label>
      <div style="position:sticky;bottom:-24px;background:#fffdf9;padding:10px 0 0;margin:8px -24px -24px;padding:10px 24px 20px;border-top:1px solid #f3ece2">
        <button id="expSave" style="width:100%;padding:14px;border-radius:12px;border:none;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,#527461,#4f735f);cursor:pointer;box-shadow:0 4px 14px rgba(91,127,107,.3)">שמור הוצאה</button>
      </div>
    </div></div>`);
    g("cExp").onclick=()=>ih("m1","");
    g("expO").onclick=e=>{if(e.target.id==="expO")ih("m1","");};
    g("expSave").onclick=()=>{
      const a=parseFloat(g("expA").value);
      if(!a){g("expA").focus();return;}
      if(!selCat)return;
      const desc=(g("expD").value||"").trim();
      const date=g("expDt").value||today();
      const isRec=g("expRec").checked;
      const inst=Math.max(1,parseInt(g("expInst").value)||1);
      const baseId=Date.now();
      const subCat=selSub||null;
      // The entered date decides the (first) month, not the month on screen
      const b=dateBucket(date);
      if(b.y===S.year)S.month=b.m;
      if(isRec){
        for(let m=S.month;m<12;m++){
          S.mData[m][selCat].entries.push({id:baseId+m*1000,desc,amount:a,date:bucketDate(date,S.year,m),recurring:true,subCat});
        }
        sv();
        applyToFutureYears(baseId,selCat,(entries,relId,m,fy)=>{
          if(entries.some(e=>e.id===relId))return undefined;
          return[...entries,{id:relId,desc,amount:a,date:adjDate(date,m,fy),recurring:true,subCat}];
        });
      } else if(inst>1){
        const perMonth=Math.round(a/inst*100)/100,later={};
        for(let i=0;i<inst;i++){
          const abs=b.y*12+b.m+i,tMonth=abs%12,tYear=Math.floor(abs/12);
          const entryDate=bucketDate(date,tYear,tMonth);
          const entryDesc=desc?(desc+' ('+(i+1)+'/'+inst+')'):(''+(i+1)+'/'+inst);
          if(tYear===S.year){
            if(!S.mData[tMonth])S.mData[tMonth]={};
            if(!S.mData[tMonth][selCat])S.mData[tMonth][selCat]={entries:[]};
            S.mData[tMonth][selCat].entries.push({id:baseId+i*1000,desc:entryDesc,amount:perMonth,date:entryDate,recurring:false,subCat,inst:{base:baseId,n:inst,i}});
          } else {
            (later[tYear]=later[tYear]||[]).push({m:tMonth,e:{id:baseId+i*1000,desc:entryDesc,amount:perMonth,date:entryDate,recurring:false,subCat,inst:{base:baseId,n:inst,i}}});
          }
        }
        sv();
        Object.keys(later).forEach(y=>editYear(+y,d=>{
          later[y].forEach(({m,e})=>{if(!d.mData[m])d.mData[m]={income:[]};if(!d.mData[m][selCat])d.mData[m][selCat]={entries:[]};d.mData[m][selCat].entries.push(e);});
          if(!d.cats.find(c=>c.id===selCat)){const c=S.cats.find(c=>c.id===selCat);if(c)d.cats.push({...c});}
        }));
      } else if(b.y===S.year){
        S.mData[b.m][selCat].entries.push({id:baseId,desc,amount:a,date,recurring:false,subCat});
        sv();
      } else {
        editYear(b.y,d=>{
          if(!d.mData[b.m])d.mData[b.m]={income:[]};if(!d.mData[b.m][selCat])d.mData[b.m][selCat]={entries:[]};
          d.mData[b.m][selCat].entries.push({id:baseId,desc,amount:a,date,recurring:false,subCat});
          if(!d.cats.find(c=>c.id===selCat)){const c=S.cats.find(c=>c.id===selCat);if(c)d.cats.push({...c});}
        });
      }
      ih("m1","");rMon();
    };
    g("expA").onkeydown=e=>{if(e.key==="Enter")g("expSave").click();};
    document.querySelectorAll(".expCat").forEach(b=>b.onclick=()=>{
      _desc=(g("expD")?.value||"");_amt=(g("expA")?.value||"");_date=(g("expDt")?.value||today());_rec=(g("expRec")?.checked||false);_inst=parseInt(g("expInst")?.value)||1;
      selCat=parseInt(b.dataset.c);selSub=null;build();
      requestAnimationFrame(()=>{const el=g("expA");if(el)el.focus();});
    });
    document.querySelectorAll(".expSub").forEach(b=>b.onclick=()=>{
      _desc=(g("expD")?.value||"");_amt=(g("expA")?.value||"");_date=(g("expDt")?.value||today());_rec=(g("expRec")?.checked||false);_inst=parseInt(g("expInst")?.value)||1;
      const sid=parseInt(b.dataset.s);selSub=selSub===sid?null:sid;build();
    });
  }
  build();
}

function rIncMod(){
  const inc=S.mData[S.month]?.income||[],tot=incT(S.month);
  const list=inc.length===0
    ?`<div style="text-align:center;color:#756a5c;font-size:14px;padding:20px 0">אין הכנסות עדיין</div>`
    :inc.map((e,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:${i%2===0?'#faf6ef':'#fff'};margin-bottom:3px">
        <span style="font-size:11px;color:#756a5c;flex-shrink:0">${fmDate(e.date)}</span>
        <span style="font-size:13px;color:#6f6457;flex:1">${e.recurring?'<span title="הכנסה קבועה" aria-label="הכנסה קבועה">&#128260;</span> ':''}${e.src==='business'?'<span title="מאפליקציית העסק" aria-label="מאפליקציית העסק">&#127970;</span> ':''}${e.desc||'—'}</span>
        <span style="font-size:14px;font-weight:700;color:#3f7356">&#8362;${fm(e.amount)}</span>
        <button class="eInc" data-e="${e.id}" aria-label="עריכת סכום" style="background:transparent;border:none;cursor:pointer;font-size:14px;color:#6f6457;padding:3px">&#9998;</button>
        <button class="dInc" data-e="${e.id}" style="background:transparent;border:none;cursor:pointer;font-size:15px;color:#b0472e;padding:3px">&#128465;</button>
      </div>`).join("");
  ih("m1",`<div class="overlay" id="incO"><div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:16px;font-weight:800;color:#3f7356">&#128176; הכנסות — ${moLabel(S.month)}</span>
      <button id="cInc" style="background:#f3ece2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:#6f6457">&times;</button>
    </div>
    <button id="incShow" style="width:100%;padding:11px;border-radius:12px;border:1px dashed #c9d9ce;background:#eef3ef;color:#3f7356;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:12px;font-family:inherit">+ הוסף הכנסה</button>
    <div id="incForm" style="display:none;gap:5px;margin-bottom:12px;flex-wrap:wrap">
      <input class="inp" id="iD" placeholder="תיאור (משכורת, פרילנס...)" style="flex:2;min-width:120px;padding:8px 10px"/>
      <input class="inp" id="iA" type="number" placeholder="&#8362;" style="flex:1;min-width:70px;padding:8px 10px;font-size:15px;font-weight:700"/>
      <input class="inp" id="iDt" type="date" value="${today()}" style="flex:1;min-width:100px;padding:8px 6px;font-size:12px"/>
      <button id="iAdd" style="padding:8px 14px;border-radius:10px;border:none;color:#fff;background:linear-gradient(135deg,#3d7556,#3f7356);font-size:20px;cursor:pointer">+</button>
      <label style="display:flex;align-items:center;gap:7px;width:100%;font-size:13px;color:#5e554a;cursor:pointer;margin-top:4px">
        <input type="checkbox" id="iRec" style="width:17px;height:17px;accent-color:#3f7356"/> &#128260; הכנסה קבועה — תיכנס כל חודש (למשל משכורת, קצבה)
      </label>
    </div>
    <div style="max-height:260px;overflow-y:auto">${list}</div>
    ${inc.length>0?`<div style="margin-top:10px;border-top:1px solid #ece4d8;padding-top:10px;display:flex;justify-content:space-between"><span style="color:#756a5c;font-size:12px">${inc.length} הכנסות</span><span style="font-weight:700;color:#3f7356">&#8362;${fm(tot)}</span></div>`:""}
  </div></div>`);
  g("cInc").onclick=()=>{ih("m1","");rMon();};
  g("incO").onclick=e=>{if(e.target.id==="incO"){ih("m1","");rMon();}};
  g("incShow").onclick=()=>{g("incShow").style.display='none';g("incForm").style.display='flex';g("iA").focus();};
  g("iA").onkeydown=e=>{if(e.key==="Enter")g("iAdd").click();};
  g("iAdd").onclick=()=>{
    const a=parseFloat(g("iA").value);if(!a)return;
    const desc=(g("iD").value||"").trim(),date=g("iDt").value||today();
    if(g("iRec").checked){
      // Recurring income: this month to the end of the year, and the years already created
      // (same id scheme as recurring expenses: baseId + month*1000)
      const baseId=Date.now();
      for(let m=S.month;m<12;m++){
        if(!S.mData[m])S.mData[m]={income:[]};if(!S.mData[m].income)S.mData[m].income=[];
        S.mData[m].income.push({id:baseId+m*1000,desc,amount:a,date:bucketDate(date,S.year,m),recurring:true});
      }
      sv();
      forIncomeFutureYears(baseId,(list,relId,m,fy)=>list.some(e=>e.id===relId)?undefined:[...list,{id:relId,desc,amount:a,date:adjDate(date,m,fy),recurring:true}]);
    }else{
      if(!S.mData[S.month].income)S.mData[S.month].income=[];
      S.mData[S.month].income.push({id:Date.now(),desc,amount:a,date});
      sv();
    }
    rIncMod();
  };
  // Change the amount; for recurring income, from this month on (a raise, a new allowance…)
  document.querySelectorAll(".eInc").forEach(b=>b.onclick=()=>{
    const id=parseInt(b.dataset.e),entry=(S.mData[S.month].income||[]).find(e=>e.id===id);if(!entry)return;
    const v=prompt(entry.recurring?'סכום חדש להכנסה הקבועה (מהחודש הזה והלאה):':'סכום חדש:',entry.amount);
    const a=parseFloat(v);if(v===null||!a)return;
    if(entry.recurring){
      const bid=id-S.month*1000;
      for(let m=S.month;m<12;m++)(S.mData[m]?.income||[]).forEach(e=>{if(e.id===bid+m*1000)e.amount=a;});
      sv();
      forIncomeFutureYears(bid,(list,relId)=>list.some(e=>e.id===relId)?list.map(e=>e.id===relId?{...e,amount:a}:e):undefined);
    }else{entry.amount=a;sv();}
    rIncMod();
  });
  document.querySelectorAll(".dInc").forEach(b=>b.onclick=()=>{
    const id=parseInt(b.dataset.e),entry=(S.mData[S.month].income||[]).find(e=>e.id===id);
    if(entry?.recurring){
      if(!confirm('זו הכנסה קבועה. למחוק אותה מהחודש הזה והלאה?\n(בחודשים הקודמים היא תישאר)'))return;
      const bid=id-S.month*1000;
      for(let m=S.month;m<12;m++)if(S.mData[m]?.income)S.mData[m].income=S.mData[m].income.filter(e=>e.id!==bid+m*1000);
      sv();
      forIncomeFutureYears(bid,(list,relId)=>list.some(e=>e.id===relId)?list.filter(e=>e.id!==relId):undefined);
    }else{
      S.mData[S.month].income=S.mData[S.month].income.filter(e=>e.id!==id);
      sv();
    }
    rIncMod();
  });
}

// A year's data: this year from memory, other years from the cloud (else this device)
async function loadYearData(y){
  if(y===S.year)return{cats:S.cats,mData:S.mData};
  if(db){try{const sn=await _getDoc(pDoc('y'+y));if(sn.exists())return sn.data();}catch(e){console.warn('FB year load:',e);}}
  try{return JSON.parse(localStorage.getItem(sk(y))||'null')||{mData:{}};}catch{return{mData:{}};}
}
// Spending in one category over the last 6 budget months (this one included)
async function rCatHistory(catId){
  const box=g("entHist"),btn=g("histBtn");if(!box)return;
  btn.style.display='none';box.innerHTML='<div style="text-align:center;color:#756a5c;font-size:12px;padding:10px">טוען…</div>';
  const cat=S.cats.find(c=>c.id===catId)||{};
  const rows=[],cache={};
  for(let i=0;i<6;i++){
    const abs=S.year*12+S.month-i,y=Math.floor(abs/12),m=abs%12;
    if(!cache[y])cache[y]=await loadYearData(y);
    const ents=cache[y].mData?.[m]?.[catId]?.entries||[];
    const sum=f=>ents.filter(f).reduce((t,e)=>t+(parseFloat(e.amount)||0),0);
    rows.push({label:moLabel(m)+(y!==S.year?' '+y:''),v:sum(e=>!e.recurring),r:sum(e=>e.recurring),now:i===0});
  }
  const tot=x=>x.v+x.r,max=Math.max(1,...rows.map(tot)),bud=(cat.budget||0)+(cat.budgetRec||0);
  const past=rows.slice(1).filter(x=>tot(x)>0),avg=past.reduce((t,x)=>t+tot(x),0)/Math.max(1,past.length);
  const html=`<div style="margin-top:12px;border-top:1px solid #ece4d8;padding-top:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <span style="font-size:13.5px;font-weight:700;color:#2f2a24">&#128197; חצי שנה אחרונה</span>
      <span style="font-size:12px;color:#6f6457">${past.length?`ממוצע חודשי: &#8362;${fm0(avg)}`:'אין עדיין חודשים קודמים'}${bud?` · תקציב &#8362;${fm0(bud)}`:''}</span>
    </div>
    ${rows.map(x=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">

      S.mData[S.month][S.aCat].entries=S.mData[S.month][S.aCat].entries.map(e=>e.id===id?{...e,desc,amount:a,date,subCat}:e);

  });

    if(entry?.recurring){
      const bid=id-S.month*1000;
      for(let m=S.month;m<12;m++){
        const relId=bid+m*1000;
        if(S.mData[m]?.[S.aCat])S.mData[m][S.aCat].entries=S.mData[m][S.aCat].entries.filter(e=>e.id!==relId);

        if(!entries.some(e=>e.id===relId))return undefined;
        return entries.filter(e=>e.id!==relId);
      });
    }else if(instInfo(entry)){
      const n=instInfo(entry).n;

      sv();
    }
    rEntMod();
  });
}

function isUnlocked(uid){try{return!!localStorage.getItem('bdg_unlocked_'+(uid||CUR_UID));}catch{return false;}}
function setUnlocked(uid){GATE=false;try{localStorage.setItem('bdg_unlocked_'+(uid||CUR_UID),'1');}catch{}}

function canUseBiometric(){return!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);}
function hasBiometric(uid){try{return!!localStorage.getItem('bdg_cred_'+(uid||CUR_UID));}catch{return false;}}
async function registerBiometric(uid,onOk,onFail){
  if(!canUseBiometric()){onFail&&onFail('לא נתמך');return;}
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const u8=new TextEncoder().encode(uid||CUR_UID);
    const c=await navigator.credentials.create({publicKey:{
      challenge:ch,
      rp:{name:'תקציב משפחתי',id:window.location.hostname||'localhost'},
      user:{id:u8,name:uid||CUR_UID,displayName:USERS.find(u=>u.id===(uid||CUR_UID))?.name||''},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
      timeout:60000
    }});
    if(!c){onFail&&onFail();return;}
    localStorage.setItem('bdg_cred_'+(uid||CUR_UID),btoa(String.fromCharCode(...new Uint8Array(c.rawId))));
    onOk&&onOk();
  }catch(e){console.warn('regBio:',e);onFail&&onFail(e?.message);}
}
async function authBiometric(uid,onOk,onFail){
  if(!canUseBiometric()||!hasBiometric(uid)){onFail&&onFail();return;}
  try{
    const idB64=localStorage.getItem('bdg_cred_'+(uid||CUR_UID));
    const idBytes=Uint8Array.from(atob(idB64),c=>c.charCodeAt(0));
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rpId:window.location.hostname||'localhost',
      allowCredentials:[{id:idBytes,type:'public-key'}],
      userVerification:'required',
      timeout:60000
    }});
    onOk&&onOk();
  }catch(e){console.warn('authBio:',e);onFail&&onFail();}
}

async function deleteAccount(){

  try{
    const r=await fetch('/api/delete-account',{method:'POST',headers:{'Authorization':'Bearer '+await auth.currentUser.getIdToken()}});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'המחיקה נכשלה');
  }catch(e){alert(e.message||'המחיקה נכשלה, בדוק את החיבור לאינטרנט');return;}
  try{Object.keys(localStorage).filter(k=>k.startsWith('bdg_')).forEach(k=>localStorage.removeItem(k));}catch{}

}

// Signed-in Firebase user, once Firebase and the saved sign-in have loaded (null after ~15s)
async function waitAuthUser(){
  for(let i=0;i<60&&!auth;i++)await new Promise(r=>setTimeout(r,250));
  if(!auth)return null;
  try{await Promise.race([auth.authStateReady(),new Promise(r=>setTimeout(r,15000))]);}catch{}
  return auth.currentUser;
}

      inc=incT(m);

    }

      const r=await fetch('/api/suggest',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});

function doCSV(){
  let csv="﻿";
  for(let m=0;m<12;m++){
    csv+="\n"+MO[m]+" "+S.year+"\n";
    const inc=S.mData[m]?.income||[];
    if(inc.length){csv+="הכנסות\n";inc.forEach(e=>{csv+=(e.date||"")+","+(e.desc||"")+","+e.amount+"\n";});}
    csv+="קטגוריה,תקציב,הוצאה,יתרה,סטטוס,פירוט\n";
    S.cats.forEach(c=>{
      const ent=S.mData[m]?.[c.id]?.entries||[];
      const tot=ent.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const det=ent.map(e=>(e.recurring?'[q] ':'')+( e.date?e.date+" ":"")+( e.desc?e.desc+":":"")+e.amount).join(" | ");
      csv+=c.name+","+c.budget+","+tot+","+(c.budget-tot)+","+(c.budget>0&&tot>c.budget?"חריגה":"תקין")+",\""+det+"\"\n";
    });
    csv+="סה\"כ,,"+mt(m)+",,,\n";
  }
  const bl=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="תקציב_"+S.year+".csv";a.click();
}

// Payments made for an event expense: partial payments (pays: [{amt,date}]) plus the
// rest on the expense date once it is marked fully paid
function evPays(e){
  const amt=parseFloat(e.amount)||0,ps=(e.pays||[]).map(p=>({amt:parseFloat(p.amt)||0,date:p.date}));
  const sum=ps.reduce((t,p)=>t+p.amt,0);
  if(e.paid&&sum<amt)ps.push({amt:amt-sum,date:e.date});
  return ps;
}
function evPaid(e){return Math.min(parseFloat(e.amount)||0,evPays(e).reduce((t,p)=>t+p.amt,0));}

function expCycleMonth(dateStr){
  const start=parseInt(getCfg().monthStart)||1;
  let m=cycleMonthForDate(dateStr,start);
  if(m===null)m=dateStr?parseInt(dateStr.split('-')[1])-1:S.month;
  return(m>=0&&m<=11)?m:S.month;
}
function evtMonthTotal(mo){
  return EVENTS.reduce((tot,ev)=>tot+(ev.expenses||[]).reduce((s,e)=>s+evPays(e).filter(p=>expCycleMonth(p.date)===mo).reduce((a,p)=>a+p.amt,0),0),0);
}

function rSearch(){

  function allEntries(){
    const res=[];

        res.push({...e,catName:'הכנסה',catColor:'#3d7556',month:m,isIncome:true});

          res.push({...e,catName:c.name,catColor:c.color,catId:c.id,month:m});
        });
      });

    // Sort by date descending
    return res.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

          });
        }
      };
    });
  }
