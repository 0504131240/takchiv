<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f9a82"/><stop offset="1" stop-color="#4a6b58"/></linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc9d4"/><stop offset="1" stop-color="#f59fb2"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2b632"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- soft shadow -->
  <ellipse cx="256" cy="382" rx="118" ry="14" fill="#2f4a3b" opacity=".35"/>
  <!-- legs -->
  <rect x="178" y="320" width="34" height="56" rx="14" fill="#f08aa1"/>
  <rect x="298" y="320" width="34" height="56" rx="14" fill="#f08aa1"/>
  <!-- tail -->
  <path d="M362 262c22-6 30 12 18 20s-24-4-10-14" fill="none" stroke="#f08aa1" stroke-width="9" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="256" cy="268" rx="118" ry="92" fill="url(#pig)"/>
  <!-- ear -->
  <path d="M176 200 l-6 -52 l46 30 z" fill="#f59fb2" stroke="#f08aa1" stroke-width="6" stroke-linejoin="round"/>
  <!-- coin slot -->
  <rect x="226" y="184" width="66" height="12" rx="6" fill="#c9667e"/>
  <!-- snout -->
  <ellipse cx="148" cy="276" rx="34" ry="28" fill="#f7a9bb" stroke="#f08aa1" stroke-width="5"/>
  <ellipse cx="138" cy="276" rx="6" ry="9" fill="#c9667e"/>
  <ellipse cx="158" cy="276" rx="6" ry="9" fill="#c9667e"/>
  <!-- eye + blush -->
  <circle cx="200" cy="236" r="10" fill="#3b2a2f"/>
  <circle cx="203" cy="232" r="3.5" fill="#fff"/>
  <ellipse cx="214" cy="270" rx="14" ry="8" fill="#ff8fa8" opacity=".55"/>
  <!-- smile -->
  <path d="M188 304 q14 12 30 2" fill="none" stroke="#c9667e" stroke-width="6" stroke-linecap="round"/>
  <!-- coin -->
  <g transform="rotate(-12 260 128)">
    <circle cx="260" cy="128" r="48" fill="url(#coin)" stroke="#d99a1e" stroke-width="7"/>
    <circle cx="260" cy="128" r="34" fill="none" stroke="#fff3c4" stroke-width="4" opacity=".8"/>
    <text x="260" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#a86d08">&#8362;</text>
  </g>
  <!-- sparkle -->
  <path d="M340 104 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z" fill="#fff6d6"/>
</svg>
